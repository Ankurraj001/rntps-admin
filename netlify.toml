# Frontend and backend are deployed together on one origin (rntps-admin.netlify.app).
# Same-origin is deliberate: it lets the auth refresh cookie stay SameSite=Strict and
# first-party, which a split frontend/backend deployment cannot do (Safari blocks
# third-party cookies outright).

[build]
  # `npm run build` builds shared -> api -> web, in that order. The function bundles
  # from apps/api/dist, so the api build must have run first.
  #
  # `indexes:deploy` then builds the indexes declared in the schemas, because
  # `connectDatabase` sets autoIndex: false in production — so without this step the
  # secondary indexes and the 730-day TTL on auditLogs simply do not exist, and nothing
  # says so. It was previously documented as a deploy step that the pipeline never ran.
  #
  # It is guarded on CONTEXT = production inside the script, and that guard is
  # load-bearing: syncIndexes() DROPS indexes a schema no longer declares, so an
  # unguarded run would let a Deploy Preview of an unmerged branch delete a production
  # index. Same reasoning as the scheduled functions below only firing on production.
  command = "npm run build && npm run indexes:deploy"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # NODE_ENV=production is needed at *runtime* — it is what makes the refresh cookie
  # Secure — but npm reads the same variable during install and skips devDependencies.
  # TypeScript and Vite live there, so the build died with "tsc: not found". This forces
  # them in regardless. Nothing from devDependencies ships: the function bundle is built
  # from apps/api/dist and only pulls what it imports.
  NPM_FLAGS = "--include=dev"

  # Secrets scanning compares every configured environment variable's *value* against the
  # repo and build output, and fails the deploy on a match. These keys hold no secret, but
  # their values are documented in README.md and .env.example — as they should be, since a
  # setup guide that cannot name the SMTP host is useless. Listing them here keeps scanning
  # switched on for the values that do matter: MONGODB_URI, JWT_SECRET, SMTP_PASS and
  # RESEND_API_KEY are deliberately absent, so a genuine leak still fails the build.
  #
  # Never add a credential-bearing key to this list. Redact it from the docs instead.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST,SMTP_PORT,MAIL_FROM,APP_BASE_URL,CORS_ORIGINS,NODE_ENV"

[functions]
  node_bundler = "esbuild"
  # Mongoose resolves drivers and BSON at runtime, which esbuild cannot follow. Shipping
  # it from node_modules instead of bundling avoids "module not found" at cold start.
  external_node_modules = ["mongoose"]

# The daily fee-collection email. Netlify evaluates cron in UTC and India does not observe
# daylight saving, so 13:30 UTC is 19:00 IST every day of the year with no seasonal drift.
#
# Declared here rather than as an `export const config` inside the function: this form is
# documented as working for any function shape, and the schedule belongs with the rest of
# the deploy configuration. Scheduled functions only fire on published production deploys,
# so a Deploy Preview cannot mail the real recipient.
[functions."daily-report"]
  schedule = "30 13 * * *"

# The month-end expense report, 18:00 IST = 12:30 UTC.
#
# Days 28-31 rather than a single date, because cron cannot express "the last day of the
# month" — the shortest month has 28 days and the longest 31. The function checks whether
# today is actually month-end in IST and returns without sending on the other firings, so
# February mails once and January is not mailed four times.
[functions."monthly-expenses"]
  schedule = "30 12 28-31 * *"

# API first — a rewrite, so the browser URL stays on the same origin.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback. Must come last, or it would swallow /api.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed asset filenames are immutable, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
